---
# UAC Bypass Lab Setup
# Creates a dedicated "uacuser" and adds it to local Administrators.
# UAC is enabled at default level (Prompt for consent).
#
# This is intentionally a SEPARATE user from ludus_win_privesc_victim_user
# so that the victim user (lowpriv) can have token privileges visible
# without UAC filtering.
#
# Lab scenario:
#   lowpriv  → plain user, NOT in Administrators → whoami /priv shows all privs
#   uacuser  → local Admin, UAC on → must bypass UAC to reach High Integrity
#
# Reference: https://github.com/nickvourd/Windows-Local-Privilege-Escalation-Cookbook/blob/master/Notes/UACBypass.md

- name: Enable UAC via registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
    state: present
  loop:
    - { name: "EnableLUA",                  data: 1 }
    - { name: "ConsentPromptBehaviorAdmin", data: 5 }
    - { name: "PromptOnSecureDesktop",      data: 1 }

- name: Create dedicated UAC bypass lab user (uacuser)
  ansible.windows.win_user:
    name: uacuser
    password: "{{ ludus_win_privesc_uac_password | default('UacBypass123!') }}"
    password_never_expires: true
    state: present
    groups:
      - Users

- name: Resolve Administrators group name from SID (locale-independent)
  ansible.windows.win_shell: |
    $grp = Get-CimInstance -ClassName Win32_Group -Filter 'SID="S-1-5-32-544"' -ErrorAction Stop
    Write-Output $grp.Name
  register: _admins_group_name
  changed_when: false

- name: Add uacuser to local Administrators group (NOT the victim user)
  ansible.windows.win_group_membership:
    name: "{{ _admins_group_name.stdout | trim }}"
    members:
      - uacuser
    state: present

- name: Print UAC Bypass scenario info
  ansible.builtin.debug:
    msg:
      - "=== UAC Bypass Scenario ==="
      - "UAC user : uacuser / {{ ludus_win_privesc_uac_password | default('UacBypass123!') }}"
      - "uacuser is a local admin → UAC is ON → must bypass to reach High Integrity."
      - "Victim  : {{ ludus_win_privesc_victim_user }} is NOT in Administrators."
      - "          → whoami /priv shows all assigned privileges directly."
      - ""
      - "Goal: Bypass UAC as uacuser to get elevated shell."
      - "Common bypasses:"
      - "  - fodhelper.exe registry hijack"
      - "  - eventvwr.exe registry hijack"
      - "  - sdclt.exe bypass"
      - "  - ICMLuaUtil COM object"
      - "Enumerate: whoami /groups | findstr Level"
      - "Tool: UACMe - https://github.com/hfiref0x/UACME"
