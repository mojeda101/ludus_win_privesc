---
# GPP Cached Password (cpassword) Lab Setup
# Drops a fake Groups.xml file in the local Group Policy cache directory,
# containing a real AES-encrypted password (known test value for "Password123!").
#
# Detection: search for cpassword attribute in XML files under Group Policy paths
#
# Background: Group Policy Preferences stored encrypted passwords using a
# publicly disclosed AES key (MS14-025). Any domain user can decrypt them.
#
# Decrypt: gpp-decrypt VPe/o9YRyz2sTnnT9X1vk6blXnIoNwRSFATrBv0
#          Get-GPPPassword (PowerSploit)
#          impacket-Get-GPPPassword
#
# Reference: https://github.com/nickvourd/Windows-Local-Privilege-Escalation-Cookbook/blob/master/Notes/GPP-Passwords.md

# ═══ SCENARIO 27 — GPP Cached Password (cpassword) ═══

- name: Create fake GPP directory structure
  ansible.windows.win_file:
    path: 'C:\ProgramData\Microsoft\Group Policy\{31B2F340-016D-11D2-945F-00C04FB984F9}\Machine\Preferences\Groups'
    state: directory

- name: Deploy fake Groups.xml with cpassword attribute
  ansible.windows.win_copy:
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">
        <User clsid="{DF5F1855-51E5-4d24-8B1A-D9BDE98BA1D1}"
              name="LabAdmin"
              image="2"
              changed="2019-04-25 19:07:54"
              uid="{BE7B00D4-A47D-4EC1-B3B2-C9DCC52DF20D}">
          <Properties action="U"
                      newName=""
                      fullName="Lab Administrator"
                      description="GPP lab account"
                      cpassword="VPe/o9YRyz2sTnnT9X1vk6blXnIoNwRSFATrBv0"
                      changeLogon="0"
                      noChange="0"
                      neverExpires="1"
                      acctDisabled="0"
                      subAuthority="RID_ADMIN"
                      userName="LabAdmin"/>
        </User>
      </Groups>
    dest: 'C:\ProgramData\Microsoft\Group Policy\{31B2F340-016D-11D2-945F-00C04FB984F9}\Machine\Preferences\Groups\Groups.xml'

- name: Validate Groups.xml exists and contains cpassword attribute
  ansible.windows.win_shell: |
    $path = 'C:\ProgramData\Microsoft\Group Policy\{31B2F340-016D-11D2-945F-00C04FB984F9}\Machine\Preferences\Groups\Groups.xml'
    if (-not (Test-Path $path)) {
      Write-Output "FAIL_MISSING"
    } else {
      $content = Get-Content $path -Raw
      if ($content -match 'cpassword=') {
        Write-Output "OK"
      } else {
        Write-Output "FAIL_NO_CPASSWORD"
      }
    }
  register: _gpp_validate
  tags: validate

- name: Assert GPP cpassword scenario is configured correctly
  ansible.builtin.fail:
    msg: >
      GPP cpassword scenario validation failed (result: {{ _gpp_validate.stdout | trim }}) —
      Groups.xml is missing or does not contain a cpassword attribute.
  when: _gpp_validate.stdout | trim != "OK"
  tags: validate

- name: Print GPP cpassword scenario info
  ansible.builtin.debug:
    msg:
      - "=== GPP Cached Password (cpassword) Scenario ==="
      - "File: C:\\ProgramData\\Microsoft\\Group Policy\\{31B2F340-...}\\Machine\\Preferences\\Groups\\Groups.xml"
      - "Encrypted password (AES, public key): VPe/o9YRyz2sTnnT9X1vk6blXnIoNwRSFATrBv0"
      - "Plaintext: Password123!"
      - "Decrypt: gpp-decrypt VPe/o9YRyz2sTnnT9X1vk6blXnIoNwRSFATrBv0"
      - "         Get-GPPPassword.ps1 (PowerSploit)"
