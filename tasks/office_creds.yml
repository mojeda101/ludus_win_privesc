---
# Office Documents with Embedded Credentials Lab Setup
# Creates realistic Office documents (.docx, .xlsx, .txt, .csv) containing
# plaintext credentials in common locations attackers look for:
#   - Word document with "Passwort" / "Password" table
#   - Excel sheet with credentials list
#   - Plaintext password file (Passwörter.txt)
#   - CSV export from a password manager / AD tool
#   - IT notes with server credentials
#
# All documents are dropped in realistic locations:
#   - Desktop of victim and admin user
#   - C:\Share, C:\IT, C:\Users\Public\Documents
#
# Detection: keyword search in files:
#   findstr /si "password passwort kennwort" *.txt *.doc *.docx *.xls *.xlsx *.csv
#
# Reference: https://github.com/nickvourd/Windows-Local-Privilege-Escalation-Cookbook

# ═══ SCENARIO 30 — Office Documents with Embedded Credentials ═══

- name: Create IT share directory (world-readable)
  ansible.windows.win_file:
    path: "C:\\IT"
    state: directory

- name: Set IT share world-readable
  ansible.windows.win_acl:
    path: C:\IT
    user: Everyone
    rights: Read
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None

- name: Create Public Documents directory
  ansible.windows.win_file:
    path: "C:\\Users\\Public\\Documents"
    state: directory

- name: Create victim Desktop directory (may not exist before first logon)
  ansible.windows.win_file:
    path: "C:\\Users\\{{ ludus_win_privesc_victim_user }}\\Desktop"
    state: directory

# ── Plaintext password files ──────────────────────────────────────────────────

