      "Veeam Backup","https://{{ ludus_win_privesc_internal_veeam_host }}","{{ ludus_win_privesc_office_veeam_user }}","{{ ludus_win_privesc_office_veeam_password }}","Backup server"
      "WSUS","http://wsus.{{ ludus_win_privesc_internal_domain_fqdn }}:8530","{{ ludus_win_privesc_office_wsus_user }}","{{ ludus_win_privesc_office_wsus_password }}","Update server"
