# ── Open XML .docx (kein Word benötigt — Pure PowerShell) ────────────────────

- name: Copy pre-built Server-Zugangsdaten.docx to target
  ansible.windows.win_copy:
    src: Server-Zugangsdaten.docx
    dest: C:\IT\Server-Zugangsdaten.docx
    force: true   # always re-copy: previous deploys may have left a
                  # broken file behind (e.g. from a failed Inject run)

- name: Inject credentials into docx word/document.xml
  ansible.windows.win_shell: |
    # Edit the docx in-place using ZipArchive.Update (no extract/repack).
    # CreateFromDirectory produces archives that some Word versions render
    # as blank (entry order / encoding-flag mismatch in the OOXML package),
    # so we modify the original ZIP entry directly instead.
    Add-Type -Assembly System.IO.Compression
    Add-Type -Assembly System.IO.Compression.FileSystem

    $docPath = "C:\IT\Server-Zugangsdaten.docx"
    $zip = [System.IO.Compression.ZipFile]::Open($docPath, [System.IO.Compression.ZipArchiveMode]::Update)
    try {
      # OOXML spec uses forward slashes, but archives produced by
      # CreateFromDirectory on Windows store entries with backslashes.
      # Try both before giving up.
      $entry = $zip.GetEntry("word/document.xml")
      if ($null -eq $entry) { $entry = $zip.GetEntry("word\document.xml") }
      if ($null -eq $entry) { throw "word/document.xml not found in $docPath (tried both / and \ separators)" }

      $reader = New-Object System.IO.StreamReader($entry.Open())
      $xml    = $reader.ReadToEnd()
      $reader.Close()

      $xml = $xml.Replace("PLACEHOLDER_ADMIN_USER",      "{{ ludus_win_privesc_office_admin_user }}")
      $xml = $xml.Replace("PLACEHOLDER_ADMIN_PASSWORD",  "{{ ludus_win_privesc_office_admin_password }}")
      $xml = $xml.Replace("PLACEHOLDER_DC_HOST",         "{{ ludus_win_privesc_internal_dc_host }}")
      $xml = $xml.Replace("PLACEHOLDER_DC_USER",         "{{ ludus_win_privesc_office_dc_user }}")
      $xml = $xml.Replace("PLACEHOLDER_DC_PASSWORD",     "{{ ludus_win_privesc_office_dc_password }}")
      $xml = $xml.Replace("PLACEHOLDER_FILESERVER_HOST", "{{ ludus_win_privesc_internal_fileserver_host }}")
      $xml = $xml.Replace("PLACEHOLDER_DB_HOST",         "{{ ludus_win_privesc_internal_db_host }}")
      $xml = $xml.Replace("PLACEHOLDER_DB_PORT",         "{{ ludus_win_privesc_internal_db_port }}")
      $xml = $xml.Replace("PLACEHOLDER_SQL_PASSWORD",    "{{ ludus_win_privesc_office_sql_password }}")
      $xml = $xml.Replace("PLACEHOLDER_VEEAM_HOST",      "{{ ludus_win_privesc_internal_veeam_host }}")
      $xml = $xml.Replace("PLACEHOLDER_VEEAM_USER",      "{{ ludus_win_privesc_office_veeam_user }}")
      $xml = $xml.Replace("PLACEHOLDER_VEEAM_PASSWORD",  "{{ ludus_win_privesc_office_veeam_password }}")

      $stream = $entry.Open()
      $stream.SetLength(0)
      $writer = New-Object System.IO.StreamWriter($stream, [System.Text.Encoding]::UTF8)
      $writer.Write($xml)
      $writer.Flush()
      $writer.Close()

      Write-Output "PATCHED"
    } finally {
      $zip.Dispose()
    }

- name: Create Excel-like CSV with .xlsx extension (readable by Excel, no install needed)
  ansible.windows.win_copy:
    content: |
      Bereich,System,Benutzer,Passwort,Bemerkung
      Windows,{{ ludus_win_privesc_internal_fileserver_host }},{{ ludus_win_privesc_office_admin_user }},{{ ludus_win_privesc_office_admin_password }},Fileserver
      Windows,{{ ludus_win_privesc_internal_dc_host }},{{ ludus_win_privesc_office_dc_user }},{{ ludus_win_privesc_office_dc_password }},Domain Controller
      Datenbank,{{ ludus_win_privesc_internal_db_host }},sa,{{ ludus_win_privesc_office_sql_password }},SQL Server SA
      Backup,{{ ludus_win_privesc_internal_veeam_host }},{{ ludus_win_privesc_office_veeam_user }},{{ ludus_win_privesc_office_veeam_password }},Veeam Backup Server
      Linux,{{ ludus_win_privesc_internal_linux_ip }},{{ ludus_win_privesc_office_linux_user }},{{ ludus_win_privesc_office_linux_password }},Dev Server
      Netzwerk,router.{{ ludus_win_privesc_internal_domain_fqdn }},admin,{{ ludus_win_privesc_office_router_password }},Netzwerk-Router
      Dienst,wsus.{{ ludus_win_privesc_internal_domain_fqdn }},{{ ludus_win_privesc_office_wsus_user }},{{ ludus_win_privesc_office_wsus_password }},WSUS Server
    dest: "{{ ludus_win_privesc_victim_profile }}\\Desktop\\Passwort-Liste.csv"

- name: Validate credential documents exist in expected locations
  ansible.windows.win_shell: |
    $files = @(
      "{{ ludus_win_privesc_victim_profile }}\Desktop\Passwoerter.txt",
      "C:\IT\IT-Server-Credentials.txt",
      "C:\IT\Server-Zugangsdaten.docx",
      "C:\Users\Public\Documents\passwords_export.csv",
      "C:\Users\Public\Documents\IT-Notizen.txt",
      "{{ ludus_win_privesc_victim_profile }}\Desktop\Passwort-Liste.csv"
    )
    $missing = $files | Where-Object { -not (Test-Path $_) }
    if ($missing) {
      Write-Output "FAIL: $($missing -join ', ')"
    } else {
      Write-Output "OK"
    }
  register: _office_creds_validate
  tags: validate

- name: Assert office credential documents are configured correctly
  ansible.builtin.fail:
    msg: >
      Office credentials scenario validation failed —
      {{ _office_creds_validate.stdout | trim }}
  when: not (_office_creds_validate.stdout | trim).startswith('OK')
  tags: validate

- name: Print Office Documents with Credentials scenario info
  ansible.builtin.debug:
    msg:
      - "=== Office Documents with Embedded Credentials Scenario ==="
      - "Files deployed:"
      - "  {{ ludus_win_privesc_victim_profile }}\\Desktop\\Passwoerter.txt"
      - "  {{ ludus_win_privesc_victim_profile }}\\Desktop\\Passwort-Liste.csv"
      - "  C:\\IT\\IT-Server-Credentials.txt        (Everyone:R)"
      - "  C:\\IT\\Server-Zugangsdaten.docx          (Everyone:R, Open XML)"
      - "  C:\\Users\\Public\\Documents\\passwords_export.csv"
      - "  C:\\Users\\Public\\Documents\\IT-Notizen.txt"
      - "Enumerate (als lowpriv):"
      - "  findstr /si \"password passwort kennwort\" C:\\*.txt C:\\IT\\*.* C:\\Users\\Public\\**"
      - "  dir /s /b C:\\IT C:\\Users\\Public\\Documents {{ ludus_win_privesc_victim_profile }}\\Desktop"
      - '  Get-ChildItem -Recurse C:\ -Include *.txt,*.csv,*.docx,*.xlsx 2>$null |'
      - "    Select-String -Pattern 'password|passwort|kennwort' -CaseSensitive:$false" 

- name: Create random subfolder in Administrator Documents with credential config files
  ansible.windows.win_shell: |
    $adj  = @("backup","old","legacy","temp","archive","config","setup","install","deploy","migration")
    $noun = @("settings","config","data","files","scripts","tools","admin","server","infra","system")
    $folder   = "$($adj | Get-Random)_$($noun | Get-Random)"
    $base     = "C:\Users\{{ ludus_win_privesc_office_admin_user }}\Documents\$folder"
    New-Item -ItemType Directory -Force -Path $base | Out-Null

    # config.ini — plaintext credentials
    $ini = @()
    $ini += "[Database]"
    $ini += "Server={{ ludus_win_privesc_internal_db_host }}"
    $ini += "Port={{ ludus_win_privesc_internal_db_port }}"
    $ini += "Username=sa"
    $ini += "Password={{ ludus_win_privesc_office_admin_password }}"
    $ini += ""
    $ini += "[Application]"
    $ini += "AdminUser={{ ludus_win_privesc_office_admin_user }}"
    $ini += "AdminPassword={{ ludus_win_privesc_office_admin_password }}"
    $ini += "Environment=Production"
    $ini | Set-Content "$base\config.ini" -Encoding UTF8

    # connection.xml — database connection strings with credentials
    $xml = @()
    $xml += '<?xml version="1.0" encoding="utf-8"?>'
    $xml += '<configuration>'
    $xml += '  <connectionStrings>'
    $xml += '    <add name="MainDB" connectionString="Server={{ ludus_win_privesc_internal_db_host }};User Id=sa;Password={{ ludus_win_privesc_office_admin_password }};" />'
    $xml += '    <add name="AdminDB" connectionString="Server={{ ludus_win_privesc_internal_db_host }};User Id={{ ludus_win_privesc_office_admin_user }};Password={{ ludus_win_privesc_office_admin_password }};" />'
    $xml += '  </connectionStrings>'
    $xml += '  <appSettings>'
    $xml += '    <add key="AdminUser" value="{{ ludus_win_privesc_office_admin_user }}" />'
    $xml += '    <add key="AdminPass" value="{{ ludus_win_privesc_office_admin_password }}" />'
    $xml += '  </appSettings>'
    $xml += '</configuration>'
    $xml | Set-Content "$base\connection.xml" -Encoding UTF8

    # deploy.ps1 — script with hardcoded credentials
    $ps1 = @()
    $ps1 += "# Deployment script"
    $ps1 += "`$adminUser = '{{ ludus_win_privesc_office_admin_user }}'"
    $ps1 += "`$adminPass = '{{ ludus_win_privesc_office_admin_password }}'"
    $ps1 += "`$secPass   = ConvertTo-SecureString `$adminPass -AsPlainText -Force"
    $ps1 += "`$cred      = New-Object System.Management.Automation.PSCredential(`$adminUser, `$secPass)"
    $ps1 += "Invoke-Command -ComputerName {{ ludus_win_privesc_internal_dc_host }} -Credential `$cred -ScriptBlock { whoami }"
    $ps1 | Set-Content "$base\deploy.ps1" -Encoding UTF8

    # Grant victim read access for discovery
    cmd /c icacls "$base" /grant "{{ ludus_win_privesc_victim_user }}:(OI)(CI)R" | Out-Null

    Write-Output "CREATED: $base"
  register: _admin_docs_result
  failed_when: "'CREATED' not in _admin_docs_result.stdout"

- name: Show admin docs credential folder
  ansible.builtin.debug:
    msg: "{{ _admin_docs_result.stdout | trim }}"
