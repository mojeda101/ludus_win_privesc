# ── Open XML .docx (kein Word benötigt — Pure PowerShell) ────────────────────

- name: Copy pre-built Server-Zugangsdaten.docx to target
  ansible.windows.win_copy:
    src: Server-Zugangsdaten.docx
    dest: C:\IT\Server-Zugangsdaten.docx
    force: false

- name: Inject admin password into docx word/document.xml
  ansible.windows.win_shell: |
    # The docx is a ZIP — extract word/document.xml, replace placeholder, repack
    Add-Type -Assembly System.IO.Compression.FileSystem
    $docPath = "C:\IT\Server-Zugangsdaten.docx"
    $tmp     = "$env:TEMP\docx_patch"
    Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
    [System.IO.Compression.ZipFile]::ExtractToDirectory($docPath, $tmp)

    $xmlPath = "$tmp\word\document.xml"
    $xml = [System.IO.File]::ReadAllText($xmlPath)
    $xml = $xml.Replace("PLACEHOLDER_ADMIN_PASSWORD", "{{ ludus_win_privesc_admin_password }}")
    [System.IO.File]::WriteAllText($xmlPath, $xml, [System.Text.Encoding]::UTF8)

    Remove-Item $docPath -Force
    [System.IO.Compression.ZipFile]::CreateFromDirectory($tmp, $docPath)
    Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
    Write-Output "PATCHED"

- name: Create Excel-like CSV with .xlsx extension (readable by Excel, no install needed)
  ansible.windows.win_copy:
    content: |
      Bereich,System,Benutzer,Passwort,Bemerkung
      Windows,WIN2022.lab.local,Administrator,{{ ludus_win_privesc_admin_password }},PrivEsc Lab
      Windows,DC01.lab.local,Administrator,DC@dmin2024!,Domain Controller
      Datenbank,db.lab.local,sa,Sql$Admin2024!,SQL Server SA
      Backup,veeam.lab.local,veeam_svc,V33m@Backup!,Veeam Backup Server
      Linux,10.10.10.30,root,Tux$ecure2024,Dev Server
      Netzwerk,router.lab.local,admin,router@lab123,Netzwerk-Router
      Dienst,wsus.lab.local,svc_wsus,wsus_svc_P@ss!,WSUS Server
    dest: "C:\\Users\\{{ ludus_win_privesc_victim_user }}\\Desktop\\Passwort-Liste.csv"

- name: Validate credential documents exist in expected locations
  ansible.windows.win_shell: |
    $files = @(
      "C:\Users\{{ ludus_win_privesc_victim_user }}\Desktop\Passwoerter.txt",
      "C:\IT\IT-Server-Credentials.txt",
      "C:\IT\Server-Zugangsdaten.docx",
      "C:\Users\Public\Documents\passwords_export.csv",
      "C:\Users\Public\Documents\IT-Notizen.txt",
      "C:\Users\{{ ludus_win_privesc_victim_user }}\Desktop\Passwort-Liste.csv"
    )
    $missing = $files | Where-Object { -not (Test-Path $_) }
    if ($missing) {
      Write-Output "FAIL: $($missing -join ', ')"
    } else {
      Write-Output "OK"
    }
  register: _office_creds_validate
  tags: validate

- name: Assert office credential documents are configured correctly
  ansible.builtin.fail:
    msg: >
      Office credentials scenario validation failed —
      {{ _office_creds_validate.stdout | trim }}
  when: not (_office_creds_validate.stdout | trim).startswith('OK')
  tags: validate

- name: Print Office Documents with Credentials scenario info
  ansible.builtin.debug:
    msg:
      - "=== Office Documents with Embedded Credentials Scenario ==="
      - "Files deployed:"
      - "  C:\\Users\\{{ ludus_win_privesc_victim_user }}\\Desktop\\Passwoerter.txt"
      - "  C:\\Users\\{{ ludus_win_privesc_victim_user }}\\Desktop\\Passwort-Liste.csv"
      - "  C:\\IT\\IT-Server-Credentials.txt        (Everyone:R)"
      - "  C:\\IT\\Server-Zugangsdaten.docx          (Everyone:R, Open XML)"
      - "  C:\\Users\\Public\\Documents\\passwords_export.csv"
      - "  C:\\Users\\Public\\Documents\\IT-Notizen.txt"
      - "Enumerate (als lowpriv):"
      - "  findstr /si \"password passwort kennwort\" C:\\*.txt C:\\IT\\*.* C:\\Users\\Public\\**"
      - "  dir /s /b C:\\IT C:\\Users\\Public\\Documents C:\\Users\\{{ ludus_win_privesc_victim_user }}\\Desktop"
      - '  Get-ChildItem -Recurse C:\ -Include *.txt,*.csv,*.docx,*.xlsx 2>$null |'
      - "    Select-String -Pattern 'password|passwort|kennwort' -CaseSensitive:$false" 
